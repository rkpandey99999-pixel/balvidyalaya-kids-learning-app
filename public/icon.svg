<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Inner cheerful classroom frame -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="url(#cardGrad)" filter="url(#shadow)"/>

  <!-- Smiling Cartoon Sun -->
  <g transform="translate(256, 170)">
    <circle r="75" fill="#FBBF24"/>
    <circle r="65" fill="#FDE047"/>
    <!-- Eyes -->
    <ellipse cx="-24" cy="-10" rx="7" ry="10" fill="#78350F"/>
    <ellipse cx="24" cy="-10" rx="7" ry="10" fill="#78350F"/>
    <circle cx="-21" cy="-13" r="3" fill="#FFFFFF"/>
    <circle cx="27" cy="-13" r="3" fill="#FFFFFF"/>
    <!-- Rosy cheeks -->
    <circle cx="-38" cy="8" r="9" fill="#F472B6" opacity="0.6"/>
    <circle cx="38" cy="8" r="9" fill="#F472B6" opacity="0.6"/>
    <!-- Smile -->
    <path d="M -26 12 Q 0 42 26 12" stroke="#78350F" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Bilingual Letters: "A" and "अ" and "1 2 3" badges -->
  <g transform="translate(130, 345)">
    <rect x="-65" y="-55" width="130" height="110" rx="24" fill="#EF4444" filter="url(#shadow)"/>
    <text x="0" y="24" font-family="'Outfit', sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" text-anchor="middle">A</text>
  </g>

  <g transform="translate(382, 345)">
    <rect x="-65" y="-55" width="130" height="110" rx="24" fill="#3B82F6" filter="url(#shadow)"/>
    <text x="0" y="24" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" text-anchor="middle">अ</text>
  </g>

  <!-- Golden 123 badge in center -->
  <g transform="translate(256, 360)">
    <rect x="-42" y="-40" width="84" height="80" rx="20" fill="#10B981" filter="url(#shadow)"/>
    <text x="0" y="16" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle">123</text>
  </g>

  <!-- Twinkling stars -->
  <polygon points="90,90 96,108 114,114 96,120 90,138 84,120 66,114 84,108" fill="#F59E0B"/>
  <polygon points="420,95 425,110 440,115 425,120 420,135 415,120 400,115 415,110" fill="#F59E0B"/>
</svg>
